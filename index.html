    <title>Animated</title>

  <body>
    <div id="app">
      <h1>Animated</h1>
      <p>Animations with potential</p>
      <h2>CSS logo slider</h2>
      <p>Slider behavior is managed via CSS variables and requires no JavaScript.</p>
      <ul>
        <li>Pause on hover and decolorize non active slides</li>
        <li>Bi-directional</li>
        <li>Easily configure number of slides and speed</li>
      </ul>

      <div class="slider" style="--width: 100px; --height: 100px; --quantity: 13">
        <div class="slider-list">

          <div class="slide-item" style="--position: 1">
